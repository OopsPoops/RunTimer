<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111">
<title>Тренировка</title>
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Тренировка">
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}
.app{max-width:520px;margin:auto;padding:calc(env(safe-area-inset-top) + 48px) 18px 32px}
h1{font-size:27px;margin:4px 0 18px}
.card{background:#1d1d1f;border-radius:22px;padding:18px;margin-bottom:14px}
.phase{font-size:28px;font-weight:700;text-align:center}
.timer{font-variant-numeric:tabular-nums;font-size:76px;line-height:1.05;font-weight:700;text-align:center;margin:12px 0}
.sub,.next{text-align:center;color:#aaa;font-size:16px}
.bar{height:8px;background:#333;border-radius:8px;overflow:hidden;margin:20px 0 8px}
.fill{height:100%;width:0%;background:#fff}
.controls{display:flex;gap:10px}
.btn{border:0;border-radius:16px;padding:15px 10px;font-size:17px;font-weight:650;flex:1;background:#fff;color:#111}
.btn.secondary{background:#303033;color:#fff}
.settings h2{font-size:18px;margin:0 0 12px}
.row{display:grid;grid-template-columns:1fr 180px;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid #333}
.row label{font-size:16px}
.row small{display:block;color:#888;margin-top:3px}
input{width:100%;background:#303033;border:1px solid #444;color:#fff;border-radius:11px;padding:11px;font-size:17px;text-align:center}
.wi-hidden{display:none}
.input-wrap{display:flex;flex-direction:column;align-items:center}
.wunit{color:#888;font-size:12px;margin-top:2px}
.picky{width:150px;height:48px;background:#1d1d1f;border:1px solid #333;border-radius:12px;color:#fff;font-size:20px;font-weight:600;text-align:center;appearance:none;-webkit-appearance:none;padding:0}
.status{text-align:center;color:#aaa;min-height:22px;margin:10px}
.note{color:#888;font-size:13px;line-height:1.4;margin-top:12px}
.settings-toggle{width:100%;background:transparent;border:0;color:#fff;font-size:18px;font-weight:600;text-align:left;padding:4px 0 12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.settings-arrow{color:#888;font-size:14px;transition:transform .2s}
.settings-arrow.open{transform:rotate(180deg)}
.settings-body{overflow:hidden}
.settings-body.hidden{display:none}
.tpl-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.tpl-btn{border:0;border-radius:12px;padding:22px 6px;font-size:12px;font-weight:600;background:#303033;color:#fff;cursor:pointer}
.tpl-btn:active{background:#3a3a3d}
.tpl-btn.today{background:#34c759;color:#111}
.timer.blink{animation:timerBlink .7s ease-in-out}
@keyframes timerBlink{0%{color:#fff;transform:scale(1)}30%{color:#34c759;transform:scale(1.06)}70%{color:#34c759;transform:scale(1.06)}100%{color:#fff;transform:scale(1)}}
</style>
</head>
<body>
<div class="app">

<h1>🏃 Тренировка</h1>

<div class="card">
<div class="phase" id="phase">Готов</div>
<div class="timer" id="timer">00:00</div>
<div class="sub" id="round">Настрой параметры и нажми «Старт»</div>

<div class="bar">
<div class="fill" id="fill"></div>
</div>

<div class="next" id="next">—</div>
</div>

<div class="controls">
<button class="btn" id="start">Старт</button>
<button class="btn secondary" id="pause" disabled>Пауза</button>
<button class="btn secondary" id="stop" disabled>Стоп</button>
<button class="btn secondary" id="skip" disabled>Пропустить</button>
</div>

<div class="status" id="status"></div>

<div class="card settings">

<button class="settings-toggle" id="settingsToggle" type="button">⚙️ Настройки <span class="settings-arrow" id="settingsArrow">▾</span></button>

<div class="settings-body hidden" id="settingsBody">

<div class="row">
<label>Ходьба в начале</label>
<div class="input-wrap">
<input id="warm" type="number" min="0" value="3" class="wi-hidden">
<select class="picky" data-field="warm" data-min="0" data-max="1200" data-step="5"></select>
<span class="wunit">сек</span>
</div>
</div>

<div class="row">
<label>Быстрая ходьба</label>
<div class="input-wrap">
<input id="fast" type="number" min="0" value="3" class="wi-hidden">
<select class="picky" data-field="fast" data-min="0" data-max="1200" data-step="5"></select>
<span class="wunit">сек</span>
</div>
</div>

<div class="row">
<label>Бег в подходе</label>
<div class="input-wrap">
<input id="run" type="number" min="0" value="3" class="wi-hidden">
<select class="picky" data-field="run" data-min="0" data-max="1200" data-step="5"></select>
<span class="wunit">сек</span>
</div>
</div>

<div class="row">
<label>Ходьба в подходе</label>
<div class="input-wrap">
<input id="cycleWalk" type="number" min="0" value="3" class="wi-hidden">
<select class="picky" data-field="cycleWalk" data-min="0" data-max="1200" data-step="5"></select>
<span class="wunit">сек</span>
</div>
</div>

<div class="row">
<label>Количество подходов</label>
<div class="input-wrap">
<input id="cycles" type="number" min="1" value="2" class="wi-hidden">
<select class="picky" data-field="cycles" data-min="1" data-max="10" data-step="1"></select>
<span class="wunit">шт</span>
</div>
</div>

<div class="row">
<label>Ходьба в конце</label>
<div class="input-wrap">
<input id="cool" type="number" min="0" value="3" class="wi-hidden">
<select class="picky" data-field="cool" data-min="0" data-max="1200" data-step="5"></select>
<span class="wunit">сек</span>
</div>
</div>

<div class="note">
Время задаётся в секундах. Телефон озвучивает каждый этап и предупреждает за 10 секунд до переключения.
</div>

</div>

</div>

<div class="card templates">
<button class="settings-toggle" id="templatesToggle" type="button">📋 Шаблоны <span class="settings-arrow" id="templatesArrow">▾</span></button>
<div class="settings-body hidden" id="templatesBody">
<div class="tpl-grid" id="tplGrid"></div>
</div>
</div>

</div>

<script>
let phases=[];
let idx=0;
let remaining=0;
let running=false;
let paused=false;
let last=0;
let raf;
let wakeLockRef=null;

const $=id=>document.getElementById(id);

function value(id){
return Math.max(0,parseInt($(id).value)||0);
}

function build(){
let cycles=Math.max(1,value("cycles"));
phases=[];
if(value("warm")){
phases.push({
name:"Спокойная ходьба",
sec:value("warm")
});
}
if(value("fast")){
phases.push({
name:"Быстрая ходьба",
sec:value("fast")
});
}
for(let i=1;i<=cycles;i++){
phases.push({
name:"Бег",
sec:value("run"),
cycle:i
});
if(value("cycleWalk")>0){
phases.push({
name:"Ходьба",
sec:value("cycleWalk"),
cycle:i
});
}
}
if(value("cool")){
phases.push({
name:"Спокойная ходьба",
sec:value("cool"),
final:true
});
}
}

function format(seconds){
seconds=Math.max(0,Math.ceil(seconds));
let min=Math.floor(seconds/60);
let sec=seconds%60;
return String(min).padStart(2,"0")+":"+String(sec).padStart(2,"0");
}

function plural(n,one,few,many){
let n10=n%10,n100=n%100;
if(n10===1&&n100!==11)return one;
if(n10>=2&&n10<=4&&(n100<12||n100>14))return few;
return many;
}

function describeTime(sec){
sec=Math.max(0,Math.round(sec));
let m=Math.floor(sec/60);
let s=sec%60;
let parts=[];
if(m>0)parts.push(m+" "+plural(m,"минута","минуты","минут"));
if(s>0)parts.push(s+" "+plural(s,"секунда","секунды","секунд"));
return parts.join(" ")||"0 секунд";
}

function speak(text){
if(!("speechSynthesis" in window))
return;
speechSynthesis.cancel();
let utterance=new SpeechSynthesisUtterance(text);
utterance.lang="ru-RU";
utterance.rate=.95;
utterance.pitch=1;
speechSynthesis.speak(utterance);
}

function beep(){
try{
let Audio=window.AudioContext||window.webkitAudioContext;
if(Audio){
let audio=new Audio();
let oscillator=audio.createOscillator();
let gain=audio.createGain();
oscillator.connect(gain);
gain.connect(audio.destination);
oscillator.frequency.value=880;
gain.gain.value=.12;
oscillator.start();
oscillator.stop(audio.currentTime+.16);
}
}catch(e){}
if(navigator.vibrate){
navigator.vibrate([180,80,180]);
}
}

function blink(){
let el=$("timer");
if(!el)return;
el.classList.remove("blink");
void el.offsetWidth;
el.classList.add("blink");
}

function announce(phase){
beep();
blink();
let text=phase.name;
if(phase.cycle){
text+=", подход "+phase.cycle;
}
text+=". Время — "+describeTime(phase.sec);
speak(text);
}

function render(){
let phase=phases[idx];
if(!phase)
return;
$("phase").textContent=phase.name;
$("timer").textContent=format(remaining);
if(phase.cycle){
$("round").textContent=
"Подход "+phase.cycle+" из "+value("cycles");
}else if(phase.final){
$("round").textContent="Завершение";
}else{
$("round").textContent="Подготовка";
}
let next=phases[idx+1];
if(next){
$("next").textContent=
"Далее: "+next.name+
(next.cycle?" (подход "+next.cycle+")":"");
}else{
$("next").textContent=
"После этого — конец";
}
let progress=100*(1-remaining/phase.sec);
$("fill").style.width=progress+"%";
}

function start(){
build();
idx=0;
remaining=phases[0].sec;
running=true;
paused=false;
$("start").textContent="Заново";
$("pause").disabled=false;
$("stop").disabled=false;
$("skip").disabled=false;
announce(phases[0]);
render();
keepScreenOn();
last=performance.now();
raf=requestAnimationFrame(tick);
}

function tick(now){
if(!running)
return;
if(!paused){
let delta=(now-last)/1000;
last=now;
remaining-=delta;
if(
remaining<=10 &&
remaining>9
){
let next=phases[idx+1];
speak(
"Через 10 секунд — "+
(next?next.name:"конец")
);
}
if(remaining<=0){
let advanced=false;
while(remaining<=0){
idx++;
if(idx>=phases.length){
finish();
return;
}
remaining+=phases[idx].sec;
advanced=true;
}
if(advanced)announce(phases[idx]);
}
render();
}else{
last=now;
}
raf=requestAnimationFrame(tick);
}

function togglePause(){
if(!running)
return;
paused=!paused;
$("pause").textContent=
paused?"Продолжить":"Пауза";
$("status").textContent=
paused?"На паузе":"";
if(!paused){
last=performance.now();
}
}

function skip(){
if(!running)
return;
idx++;
if(idx>=phases.length){
finish();
return;
}
remaining=phases[idx].sec;
announce(phases[idx]);
render();
last=performance.now();
}

function stop(){
running=false;
paused=false;
cancelAnimationFrame(raf);
if("speechSynthesis" in window)speechSynthesis.cancel();
idx=0;
remaining=0;
$("phase").textContent="Готов";
$("timer").textContent="00:00";
$("round").textContent="Настрой параметры и нажми «Старт»";
$("next").textContent="—";
$("fill").style.width="0%";
$("status").textContent="";
$("pause").disabled=true;
$("stop").disabled=true;
$("skip").disabled=true;
$("start").textContent="Старт";
releaseScreenLock();
}

function finish(){
running=false;
cancelAnimationFrame(raf);
beep();
speak(
"Тренировка закончена. Отличная работа!"
);
$("phase").textContent="Готово 🎉";
$("timer").textContent="00:00";
$("round").textContent="Тренировка завершена";
$("next").textContent="";
$("fill").style.width="100%";
$("pause").disabled=true;
$("stop").disabled=true;
$("skip").disabled=true;
$("start").textContent="Старт";
releaseScreenLock();
}

async function keepScreenOn(){
try{
if(!("wakeLock" in navigator))return;
if(wakeLockRef)return;
wakeLockRef=await navigator.wakeLock.request("screen");
wakeLockRef.addEventListener("release",()=>{
wakeLockRef=null;
if(running&&!paused)keepScreenOn();
});
}catch(e){}
}

function releaseScreenLock(){
if(wakeLockRef){
try{wakeLockRef.release();}catch(e){}
wakeLockRef=null;
}
}

const STORE_KEY="trenirovka_settings";

function loadSettings(){
try{
let data=JSON.parse(localStorage.getItem(STORE_KEY)||"{}");
["warm","fast","run","cycleWalk","cycles","cool"].forEach(id=>{
if(data[id]!==undefined&&$(id))$(id).value=data[id];
});
}catch(e){}
}

function saveSettings(){
try{
let data={};
["warm","fast","run","cycleWalk","cycles","cool"].forEach(id=>{
if($(id))data[id]=$(id).value;
});
localStorage.setItem(STORE_KEY,JSON.stringify(data));
}catch(e){}
}

loadSettings();
["warm","fast","run","cycleWalk","cycles","cool"].forEach(id=>{
let el=$(id);
if(el){
el.addEventListener("input",saveSettings);
el.addEventListener("change",saveSettings);
}
});

const TEMPLATES=[
{id:"1. Пн",run:1,walk:1.5,cycles:6},
{id:"1. Чт",run:1,walk:1.5,cycles:6},
{id:"1. Сб",run:1,walk:2,cycles:5},
{id:"2. Пн",run:1.5,walk:1.5,cycles:6},
{id:"2. Чт",run:2,walk:2,cycles:5},
{id:"2. Сб",run:1,walk:2,cycles:6},
{id:"3. Пн",run:2,walk:2,cycles:6},
{id:"3. Чт",run:3,walk:2,cycles:5},
{id:"3. Сб",run:2,walk:2,cycles:5},
{id:"4. Пн",run:3,walk:2,cycles:5},
{id:"4. Чт",run:4,walk:2,cycles:4},
{id:"4. Сб",run:3,walk:2,cycles:5},
{id:"5. Пн",run:5,walk:2,cycles:3},
{id:"5. Чт",run:6,walk:2,cycles:3},
{id:"5. Сб",run:4,walk:2,cycles:4},
{id:"6. Пн",run:8,walk:2,cycles:2},
{id:"6. Чт",run:10,walk:2,cycles:2},
{id:"6. Сб",run:6,walk:2,cycles:3},
{id:"7. Пн",run:12,walk:3,cycles:2},
{id:"7. Чт",run:15,walk:0,cycles:1},
{id:"7. Сб",run:8,walk:2,cycles:2},
{id:"8. Пн",run:15,walk:3,cycles:2},
{id:"8. Чт",run:20,walk:0,cycles:1},
{id:"8. Сб",run:5,walk:2,cycles:3}
];

function fmtNum(n){
return String(n).replace(".",",");
}

function applyTemplate(t){
$("run").value=Math.round(t.run*60);
$("cycleWalk").value=Math.round(t.walk*60);
$("cycles").value=t.cycles;
saveSettings();
syncPickers();
$("status").textContent="Шаблон "+t.id+": бег "+fmtNum(t.run)+" мин, ходьба "+(t.walk>0?fmtNum(t.walk)+" мин":"—")+", "+t.cycles+" подх.";
}

function buildTemplates(){
let grid=$("tplGrid");
if(!grid)return;
grid.innerHTML="";
TEMPLATES.forEach(t=>{
let b=document.createElement("button");
b.type="button";
b.className="tpl-btn";
b.dataset.id=t.id;
let w=t.walk>0?fmtNum(t.walk):"—";
b.textContent=t.id+" · "+fmtNum(t.run)+"/"+w+"×"+t.cycles;
b.onclick=()=>applyTemplate(t);
grid.appendChild(b);
});
}

const WEEK_START=new Date(2026,8,7);
const DAY_LABELS={1:"Пн",4:"Чт",6:"Сб"};

function selectTodayTemplate(){
let now=new Date();
let startOfToday=new Date(now.getFullYear(),now.getMonth(),now.getDate());
let days=Math.floor((startOfToday-WEEK_START)/86400000);
if(days<0)return;
let week=Math.floor(days/7)+1;
let label=DAY_LABELS[startOfToday.getDay()];
if(week>8||!label)return;
let id=week+". "+label;
let t=TEMPLATES.find(x=>x.id===id);
if(!t)return;
document.querySelectorAll(".tpl-btn").forEach(b=>{
b.classList.toggle("today",b.dataset.id===id);
});
applyTemplate(t);
}

function buildPickers(){
document.querySelectorAll(".picky").forEach(sel=>{
let min=parseInt(sel.dataset.min)||0;
let max=parseInt(sel.dataset.max)||1200;
let step=parseInt(sel.dataset.step)||5;
let field=sel.dataset.field;
sel.innerHTML="";
for(let v=min;v<=max;v+=step){
let o=document.createElement("option");
o.value=v;
o.textContent=v;
sel.appendChild(o);
}
sel.addEventListener("change",()=>{
let inp=document.getElementById(field);
if(inp)inp.value=sel.value;
saveSettings();
});
});
}

function syncPickers(){
document.querySelectorAll(".picky").forEach(sel=>{
let inp=document.getElementById(sel.dataset.field);
if(inp)sel.value=inp.value;
});
}

buildPickers();
syncPickers();

$("templatesToggle").onclick=()=>{
let body=$("templatesBody");
body.classList.toggle("hidden");
$("templatesArrow").classList.toggle("open");
};

buildTemplates();
selectTodayTemplate();

$("start").onclick=()=>{
if(running){
running=false;
cancelAnimationFrame(raf);
start();
}else{
start();
}
};
$("pause").onclick=togglePause;
$("stop").onclick=stop;
$("skip").onclick=skip;
$("settingsToggle").onclick=()=>{
let body=$("settingsBody");
body.classList.toggle("hidden");
$("settingsArrow").classList.toggle("open");
};
document.addEventListener(
"visibilitychange",
()=>{
if(document.visibilityState==="visible"&&running){
keepScreenOn();
}
});
window.addEventListener("focus",()=>{
if(running&&!paused){
keepScreenOn();
}
});
</script>
</body>
</html>
